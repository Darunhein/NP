<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 300px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .alerta {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            max-width: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Flask Hub</h1>  
        {{ varRoute1 | safe }}
        {{ varRoute2 | safe }}
        {{ varRoute3 | safe }}
        {{ varRoute4 | safe }}
    </div>
</body>
</html>
